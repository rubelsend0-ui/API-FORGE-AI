name: Android Debug Build

# NOTE on the Gradle wrapper: this repo does not ship a committed
# gradle-wrapper.jar (it is a binary generated by a real local Gradle
# install, which was not available when this project was scaffolded --
# see docs/ANDROID_BUILD.md). Until you add one, this workflow uses
# gradle/actions/setup-gradle to provision Gradle directly instead of
# depending on ./gradlew. If you later commit a real wrapper
# (recommended for reproducible local builds), switch the run steps
# below from `gradle` to `./gradlew`.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Expected APK not found at $APK_PATH"
            exit 1
          fi
          echo "Found APK at $APK_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-forge-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
